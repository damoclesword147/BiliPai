name: Build BiliPai APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        description: '构建版本类型：dev (推荐，自带调试签名可直接安装) 或 release (正式版)'
        required: true
        default: 'dev'
        options:
          - 'dev'
          - 'release'
      create_release:
        type: boolean
        description: '是否自动创建 GitHub Release（发布后可在 Releases 页面直接下载）'
        required: true
        default: true

permissions:
  contents: write
  packages: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK (${{ github.event.inputs.build_type || 'dev' }})
    runs-on: ubuntu-latest
    env:
      NATIVE_TARGET: "arm64-v8a"
    steps:
      - name: ⬇️ 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 📋 接受 Android SDK 许可
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: 🔑 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: ⚙️ 配置 FCM (可选)
        run: |
          if [ -n "${{ secrets.FCM }}" ]; then
            echo "发现 FCM 密钥，正在解码配置..."
            echo "${{ secrets.FCM }}" | base64 -d > app/google-services.json
          else
            echo "未配置 FCM 密钥，跳过 Firebase（BiliPai 支持在无 Firebase 状态下编译运行）"
          fi

      - name: 🔏 配置签名 (针对 Release 模式)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.RELEASE_STORE_PASSWORD }}" ] && [ -n "${{ secrets.RELEASE_KEY_ALIAS }}" ] && [ -n "${{ secrets.RELEASE_KEY_PASSWORD }}" ]; then
            echo "使用自定义 Release 密钥库签名..."
            printf '%s' "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BILI_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "BILI_RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "BILI_RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "BILI_RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "未检测到完整的 Release 密钥配置，自动生成临时自签名密钥库..."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
              -alias bilipai -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass 123456 -keypass 123456 \
              -dname "CN=BiliPai, OU=Fork, O=BiliPai, L=Unknown, S=Unknown, C=CN"
            echo "BILI_RELEASE_STORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "BILI_RELEASE_STORE_PASSWORD=123456" >> "$GITHUB_ENV"
            echo "BILI_RELEASE_KEY_ALIAS=bilipai" >> "$GITHUB_ENV"
            echo "BILI_RELEASE_KEY_PASSWORD=123456" >> "$GITHUB_ENV"
          fi

      - name: 🔨 编译 APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BILI_BUILD_COMMIT_SHA: ${{ github.sha }}
          BILI_BUILD_GIT_REF: ${{ github.ref }}
          BILI_BUILD_WORKFLOW_RUN_ID: ${{ github.run_id }}
          BILI_BUILD_WORKFLOW_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BILI_BUILD_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          COMMON_ARGS=(
            "--max-workers=4"
            "-Pbili.build.commitSha=${BILI_BUILD_COMMIT_SHA}"
            "-Pbili.build.gitRef=${BILI_BUILD_GIT_REF}"
            "-Pbili.build.workflowRunId=${BILI_BUILD_WORKFLOW_RUN_ID}"
            "-Pbili.build.workflowRunUrl=${BILI_BUILD_WORKFLOW_RUN_URL}"
            "-Pbili.build.releaseTag=${BILI_BUILD_RELEASE_TAG}"
          )

          BUILD_TYPE="${{ github.event.inputs.build_type || 'dev' }}"
          echo "正在以 ${BUILD_TYPE} 模式执行编译..."

          if [ "$BUILD_TYPE" = "release" ]; then
            ./gradlew "${COMMON_ARGS[@]}" assembleRelease
          else
            ./gradlew "${COMMON_ARGS[@]}" assembleDev
          fi

      - name: 📦 收集 APK 安装包与生成校验和
        id: collect_apks
        run: |
          mkdir -p dist
          # 搜索所有生成的 apk
          find app/build/outputs -type f -name "*.apk" -exec cp {} dist/ \;

          cd dist
          echo "=== 成功收集到的 APK 文件列表 ==="
          ls -lh
          
          # 计算 SHA256 校验码
          sha256sum *.apk | tee checksums.txt
          
          VERSION_NAME=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' ../app/build.gradle.kts | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="0.7.6"
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: 📤 上传构建产物 (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: BiliPai-${{ github.event.inputs.build_type || 'dev' }}-APK
          path: dist/*
          retention-days: 30

      - name: 🚀 发布到 GitHub Releases
        if: ${{ github.event.inputs.create_release != false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.collect_apks.outputs.version_name }}
        run: |
          TAG_NAME="v${VERSION_NAME}-build.${{ github.run_number }}"
          RELEASE_TITLE="BiliPai v${VERSION_NAME} (构建 #${{ github.run_number }})"
          
          cat << 'EOF' > release_notes.md
          ## 📱 BiliPai 安装包已编译完成

          - **构建类型**: `${{ github.event.inputs.build_type || 'dev' }}`
          - **提交 SHA**: `${{ github.sha }}`
          - **触发时间**: `${{ github.event.head_commit.timestamp || '手动触发' }}`

          ### 校验和 (SHA-256)
          ```text
          EOF
          cat dist/checksums.txt >> release_notes.md
          echo '```' >> release_notes.md

          echo "正在创建 Release: $TAG_NAME"
          gh release create "$TAG_NAME" dist/* \
            --title "$RELEASE_TITLE" \
            --notes-file release_notes.md
